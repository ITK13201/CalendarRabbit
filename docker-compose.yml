services:
  mysql:
    image: mysql:8.4
    environment:
      # 値は 1Password 管理（op run --env-file=.env.op で注入）。
      # op 未使用時もローカル開発で動くよう既定値を持たせる。
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${DB_NAME:-calendarrabbit}
      MYSQL_USER: ${DB_USER:-calendarrabbit}
      MYSQL_PASSWORD: ${DB_PASSWORD:-calendarrabbit}
      TZ: UTC
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-rootpassword}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      # トポロジ（ホスト名/ポート）は compose 固有のため固定。
      PORT: "8080"
      DB_HOST: mysql
      DB_PORT: "3306"
      # 以下は 1Password 管理（op run で注入）。既定値はローカル開発用。
      DB_USER: ${DB_USER:-calendarrabbit}
      DB_PASSWORD: ${DB_PASSWORD:-calendarrabbit}
      DB_NAME: ${DB_NAME:-calendarrabbit}
      # LLM プロバイダ選択（deepseek 既定 / claude 切り戻し）。
      LLM_PROVIDER: ${LLM_PROVIDER:-deepseek}
      # DeepSeek（既定プロバイダ）。API キーは 1Password から注入必須。
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:?DEEPSEEK_API_KEY is required (op run --env-file=.env.op ...)}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-v4-pro}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      # web 検索 API（DeepSeek 経路の事前検索用）。API キーは 1Password から注入必須。
      SEARCH_PROVIDER: ${SEARCH_PROVIDER:-tavily}
      SEARCH_API_KEY: ${SEARCH_API_KEY:?SEARCH_API_KEY is required (op run --env-file=.env.op ...)}
      SEARCH_MAX_RESULTS: ${SEARCH_MAX_RESULTS:-10}
      # Claude は切り戻し用。既定はダミー（LLM_PROVIDER=claude 時のみ実キーを注入）。
      CLAUDE_API_KEY: ${CLAUDE_API_KEY:-dummy-claude-api-key}
      CLAUDE_MODEL: ${CLAUDE_MODEL:-claude-sonnet-4-6}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:8081}
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "8081:80"
    depends_on:
      - backend

volumes:
  mysql-data:
