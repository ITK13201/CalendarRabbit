name: Release Helm Chart

on:
  push:
    tags:
      - 'calendarrabbit-v*'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  OWNER: ${{ github.repository_owner }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Login to GHCR
        run: |
          helm registry login ${{ env.REGISTRY }} \
            --username ${{ github.actor }} \
            --password ${{ secrets.GITHUB_TOKEN }}

      - name: Package chart
        run: helm package charts/calendarrabbit

      - name: Push chart to GHCR
        run: helm push calendarrabbit-*.tgz oci://${{ env.REGISTRY }}/${OWNER,,}
        env:
          OWNER: ${{ env.OWNER }}
