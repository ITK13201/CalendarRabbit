name: helm-release

on:
  push:
    branches: [main]
    paths:
      - "charts/**"
    tags:
      - "chart-v*"
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.20.2

      - name: Lint chart
        run: helm lint charts/calendarrabbit

      - name: Package chart
        run: |
          mkdir -p .cr-release-packages
          helm package charts/calendarrabbit --destination .cr-release-packages

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Push chart to GHCR (OCI)
        run: |
          for pkg in .cr-release-packages/*.tgz; do
            helm push "$pkg" "oci://ghcr.io/${{ github.repository_owner }}/charts"
          done

      - name: Upload chart artifact
        uses: actions/upload-artifact@v4
        with:
          name: helm-chart
          path: .cr-release-packages/*.tgz
