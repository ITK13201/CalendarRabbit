# CalendarRabbit Helm values

nameOverride: ""
fullnameOverride: ""

backend:
  image:
    repository: ghcr.io/itk13201/calendarrabbit-backend
    tag: latest
    pullPolicy: IfNotPresent
  replicas: 1
  port: 8080
  env:
    # LLM プロバイダ選択（deepseek 既定 / claude 切り戻し）。
    llmProvider: deepseek
    claudeModel: claude-sonnet-4-6
    # DeepSeek（OpenAI 互換 API）設定。
    deepseekModel: deepseek-v4-pro
    deepseekBaseURL: https://api.deepseek.com
    # web 検索 API 設定（DeepSeek 経路の事前検索用）。
    searchProvider: tavily
    searchMaxResults: 10
    allowedOrigins: "*"
    # Google Calendar 連携（非機密）。空なら連携は休眠する。
    # 有効化する場合は --set で上書きする。
    googleOAuthClientID: ""
    googleOAuthRedirectURL: ""
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi
  # backend の機密情報。既存 Secret を使う場合は existingSecret を指定。
  secret:
    existingSecret: ""
    # VPN 前提のため既定はダミー。実運用では必ず --set で上書きする。
    # deepseek 経路では deepseekApiKey / searchApiKey を、claude 経路では claudeApiKey を設定する。
    claudeApiKey: "dummy-claude-api-key"
    deepseekApiKey: "dummy-deepseek-api-key"
    searchApiKey: "dummy-search-api-key"
    # Google Calendar 連携（機密）。既定は空文字。
    # ダミー値にすると backend が「設定済み」と誤認し連携を起動しうるため、
    # 休眠を保つには空文字のままにする。有効化時は --set で上書きする。
    googleOAuthClientSecret: ""
    googleTokenEncKey: ""

frontend:
  image:
    repository: ghcr.io/itk13201/calendarrabbit-frontend
    tag: latest
    pullPolicy: IfNotPresent
  replicas: 1
  port: 80
  # nginx が API をプロキシする先（backend Service）。空なら自動導出。
  backendUrl: ""
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 200m
      memory: 128Mi

mysql:
  enabled: true
  image:
    repository: mariadb
    tag: "11.4"
    pullPolicy: IfNotPresent
  port: 3306
  database: calendarrabbit
  user: calendarrabbit
  # 本番では mysql.secret.existingSecret / --set で上書きすること。
  password: calendarrabbit
  rootPassword: rootpassword
  # mysql の機密情報。既存 Secret を使う場合は existingSecret を指定。
  secret:
    existingSecret: ""
  persistence:
    enabled: true
    size: 5Gi
    storageClass: ""
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi
