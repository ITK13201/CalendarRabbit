apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "calendarrabbit.frontendFullname" . }}-config
  labels:
    {{- include "calendarrabbit.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
data:
  BACKEND_URL: {{ .Values.frontend.backendUrl | default (printf "http://%s:%v" (include "calendarrabbit.backendFullname" .) .Values.backend.port) | quote }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "calendarrabbit.frontendFullname" . }}
  labels:
    {{- include "calendarrabbit.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  replicas: {{ .Values.frontend.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: frontend
  template:
    metadata:
      labels:
        {{- include "calendarrabbit.labels" . | nindent 8 }}
        app.kubernetes.io/component: frontend
    spec:
      containers:
        - name: frontend
          image: "{{ .Values.frontend.image.repository }}:{{ .Values.frontend.image.tag }}"
          imagePullPolicy: {{ .Values.frontend.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.frontend.port }}
          envFrom:
            - configMapRef:
                name: {{ include "calendarrabbit.frontendFullname" . }}-config
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "calendarrabbit.frontendFullname" . }}
  labels:
    {{- include "calendarrabbit.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: frontend
  ports:
    - name: http
      port: {{ .Values.frontend.port }}
      targetPort: http
