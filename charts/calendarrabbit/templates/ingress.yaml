{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "calendarrabbit.fullname" . }}
  labels:
    {{- include "calendarrabbit.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          # API/Swagger は backend へ
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ include "calendarrabbit.backendFullname" . }}
                port:
                  number: {{ .Values.backend.port }}
          - path: /swagger
            pathType: Prefix
            backend:
              service:
                name: {{ include "calendarrabbit.backendFullname" . }}
                port:
                  number: {{ .Values.backend.port }}
          # それ以外は frontend へ
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "calendarrabbit.frontendFullname" . }}
                port:
                  number: {{ .Values.frontend.port }}
{{- end }}
