{{- if and .Values.mysql.enabled (not .Values.mysql.secret.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "calendarrabbit.mysqlSecretName" . }}
  labels:
    {{- include "calendarrabbit.labels" . | nindent 4 }}
    app.kubernetes.io/component: mysql
type: Opaque
stringData:
  MYSQL_PASSWORD: {{ .Values.mysql.password | quote }}
  MYSQL_ROOT_PASSWORD: {{ .Values.mysql.rootPassword | quote }}
{{- end }}
