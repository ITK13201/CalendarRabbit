{{- if not .Values.backend.secret.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  namespace: {{ .Release.Namespace }}
  name: {{ include "calendarrabbit.backendSecretName" . }}
  labels:
    {{- include "calendarrabbit.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
type: Opaque
stringData:
  CLAUDE_API_KEY: {{ .Values.backend.secret.claudeApiKey | quote }}
  DEEPSEEK_API_KEY: {{ .Values.backend.secret.deepseekApiKey | quote }}
  SEARCH_API_KEY: {{ .Values.backend.secret.searchApiKey | quote }}
  GOOGLE_OAUTH_CLIENT_ID: {{ .Values.backend.secret.googleOAuthClientID | quote }}
  GOOGLE_OAUTH_CLIENT_SECRET: {{ .Values.backend.secret.googleOAuthClientSecret | quote }}
  GOOGLE_OAUTH_REDIRECT_URL: {{ .Values.backend.secret.googleOAuthRedirectURL | quote }}
  GOOGLE_TOKEN_ENC_KEY: {{ .Values.backend.secret.googleTokenEncKey | quote }}
  DB_PASSWORD: {{ .Values.mysql.password | quote }}
{{- end }}
