{{- if not .Values.backend.secret.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "calendarrabbit.backendSecretName" . }}
  labels:
    {{- include "calendarrabbit.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
type: Opaque
stringData:
  CLAUDE_API_KEY: {{ .Values.backend.secret.claudeApiKey | quote }}
  DB_PASSWORD: {{ .Values.mysql.password | quote }}
{{- end }}
