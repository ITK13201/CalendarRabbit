{{- if not .Values.secret.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "calendarrabbit.secretName" . }}
  labels:
    {{- include "calendarrabbit.labels" . | nindent 4 }}
type: Opaque
stringData:
  CLAUDE_API_KEY: {{ .Values.secret.claudeApiKey | quote }}
  DB_PASSWORD: {{ .Values.mysql.password | quote }}
  MYSQL_PASSWORD: {{ .Values.mysql.password | quote }}
  MYSQL_ROOT_PASSWORD: {{ .Values.mysql.rootPassword | quote }}
{{- end }}
