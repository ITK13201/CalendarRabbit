apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: {{ .Release.Namespace }}
  name: {{ include "calendarrabbit.backendFullname" . }}
  labels:
    {{- include "calendarrabbit.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  replicas: {{ .Values.backend.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        {{- include "calendarrabbit.labels" . | nindent 8 }}
        app.kubernetes.io/component: backend
    spec:
      containers:
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.backend.port }}
          env:
            - name: PORT
              value: {{ .Values.backend.port | quote }}
            - name: DB_HOST
              value: {{ include "calendarrabbit.mysqlFullname" . | quote }}
            - name: DB_PORT
              value: {{ .Values.mysql.port | quote }}
            - name: DB_USER
              value: {{ .Values.mysql.user | quote }}
            - name: DB_NAME
              value: {{ .Values.mysql.database | quote }}
            - name: CLAUDE_MODEL
              value: {{ .Values.backend.env.claudeModel | quote }}
            - name: LLM_PROVIDER
              value: {{ .Values.backend.env.llmProvider | quote }}
            - name: DEEPSEEK_MODEL
              value: {{ .Values.backend.env.deepseekModel | quote }}
            - name: DEEPSEEK_BASE_URL
              value: {{ .Values.backend.env.deepseekBaseURL | quote }}
            - name: SEARCH_PROVIDER
              value: {{ .Values.backend.env.searchProvider | quote }}
            - name: SEARCH_MAX_RESULTS
              value: {{ .Values.backend.env.searchMaxResults | quote }}
            - name: ALLOWED_ORIGINS
              value: {{ .Values.backend.env.allowedOrigins | quote }}
            - name: GOOGLE_OAUTH_CLIENT_ID
              value: {{ .Values.backend.env.googleOAuthClientID | quote }}
            - name: GOOGLE_OAUTH_REDIRECT_URL
              value: {{ .Values.backend.env.googleOAuthRedirectURL | quote }}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "calendarrabbit.backendSecretName" . }}
                  key: DB_PASSWORD
            - name: CLAUDE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "calendarrabbit.backendSecretName" . }}
                  key: CLAUDE_API_KEY
            - name: DEEPSEEK_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "calendarrabbit.backendSecretName" . }}
                  key: DEEPSEEK_API_KEY
            - name: SEARCH_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "calendarrabbit.backendSecretName" . }}
                  key: SEARCH_API_KEY
            - name: GOOGLE_OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "calendarrabbit.backendSecretName" . }}
                  key: GOOGLE_OAUTH_CLIENT_SECRET
            - name: GOOGLE_TOKEN_ENC_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "calendarrabbit.backendSecretName" . }}
                  key: GOOGLE_TOKEN_ENC_KEY
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  namespace: {{ .Release.Namespace }}
  name: {{ include "calendarrabbit.backendFullname" . }}
  labels:
    {{- include "calendarrabbit.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: backend
  ports:
    - name: http
      port: {{ .Values.backend.port }}
      targetPort: http
